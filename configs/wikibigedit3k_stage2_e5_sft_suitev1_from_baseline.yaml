model_name_or_path: "./saves/baseline_qwen3_wikibigedit3k"
off_data_path: "./data/wikibigedit/wikibigedit_3k.json"
on_data_path: "./data/generated/wikibigedit3k_stage2_suitev1_from_baseline_on.jsonl"
save_model_dir: "./saves/wikibigedit3k_stage2_suitev1_from_baseline_sft_gate"

objective: "dynamic_gate"
use_dynamic_gate: true
on_objective: "sft"
tau_low: 0.2
tau_high: 0.7
lambda_on: 0.7
lambda_off: 0.3
on_ratio: 0.5

lr: 5.0e-5
weight_decay: 0.0
optimizer: "adamw"
torch_dtype: "bf16"
batch_size: 30
micro_batch_size: 30
num_epochs: 1
steps_per_epoch: 200

refresh_interval: 999
max_refresh_records: 3000
conflict_score_mode: "mismatch"
include_rephrase_triggers: false
trigger_mode: "suite_v1"
template_triggers: 2
k_triggers: 6
beta: 0.1

gen_cfg:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 32
  batch_size: 64

device: 0
seed: 42
train_layer: 6
rewrite_module: "model.layers.{}.mlp.down_proj.weight"

