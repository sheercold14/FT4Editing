model_name_or_path: "./saves/counterfact3k_full_e0_off_sft"
off_data_path: "./data/counterfact/counterfact_3k.json"
on_data_path: "./data/generated/counterfact3k_stage2_on_prefixtail.jsonl"
save_model_dir: "./saves/counterfact3k_stage2_e5_sft_gate_prefixtail"

objective: "dynamic_gate"
use_dynamic_gate: true
on_objective: "sft"
tau_low: 0.2
tau_high: 0.7
lambda_on: 0.7
lambda_off: 0.3
on_ratio: 0.5

lr: 1.0e-4
batch_size: 30
micro_batch_size: 30
num_epochs: 3
steps_per_epoch: 200

refresh_interval: 999
max_refresh_records: 3000
conflict_score_mode: "mismatch"
include_rephrase_triggers: false
k_triggers: 4

# Bucket mix + tail-anchored prefix-noise generator (targets `distractor_prefix_trunc`)
trigger_mode: "bucket_mix"
template_triggers: 1
distractor_pool_size: 2048
distractor_prefixes_per_record: 1
distractor_max_chars: 120

prefix_tail_per_prompt: 1
prefix_tail_words: 2
prefix_tail_gen_cfg:
  temperature: 0.9
  top_p: 0.95
  max_new_tokens: 96
  batch_size: 32

# Keep suffix heuristics off for this run
suffix_triggers_per_record: 0
paraphrase_per_prompt: 0

filter_against_eval_rephrase_threshold: 0.92

beta: 0.1

gen_cfg:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 32
  batch_size: 64

device: 0
seed: 42
train_layer: 6
rewrite_module: "model.layers.{}.mlp.down_proj.weight"
