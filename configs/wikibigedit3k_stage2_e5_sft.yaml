model_name_or_path: "./saves/wikibigedit3k_full_e0_off_sft"
off_data_path: "./data/wikibigedit/wikibigedit_3k.json"
on_data_path: "./data/generated/wikibigedit3k_stage2_on.jsonl"
save_model_dir: "./saves/wikibigedit3k_stage2_e5_sft_gate"

objective: "dynamic_gate"
use_dynamic_gate: true
on_objective: "sft"
tau_low: 0.2
tau_high: 0.7
lambda_on: 0.7
lambda_off: 0.3
on_ratio: 0.5

lr: 1.0e-4
batch_size: 30
micro_batch_size: 30
num_epochs: 3
steps_per_epoch: 200   # 200 * 30 = 6000 total samples (expected off ~= 3000)

refresh_interval: 999
max_refresh_records: 0
conflict_score_mode: "mismatch"
include_rephrase_triggers: false
k_triggers: 4
beta: 0.1

gen_cfg:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 32
  batch_size: 64

device: 0
seed: 42
train_layer: 6
rewrite_module: "model.layers.{}.mlp.down_proj.weight"
