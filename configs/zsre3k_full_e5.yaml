model_name_or_path: "/data/shichao/data/Qwen3-1.7B"
off_data_path: "./data/zsre/zsre_3k.json"
on_data_path: "./data/generated/zsre3k_full_on.jsonl"
save_model_dir: "./saves/zsre3k_full_e5_dynamic_gate"

objective: "dynamic_gate"
use_dynamic_gate: true
tau_low: 0.2
tau_high: 0.7
lambda_on: 0.7
lambda_off: 0.3
on_ratio: 0.7

lr: 5.0e-4
batch_size: 30
micro_batch_size: 30
num_epochs: 10
# Make expected off-samples ~= 3000 per epoch: total_samples * (1-on_ratio) ~= 3000
steps_per_epoch: 334   # 334 * 30 ≈ 10020 total samples

refresh_interval: 999
max_refresh_records: 0
conflict_score_mode: "mismatch"
include_rephrase_triggers: false
k_triggers: 4
beta: 0.1

gen_cfg:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 32
  batch_size: 64

device: 0
seed: 42
train_layer: 6
rewrite_module: "model.layers.{}.mlp.down_proj.weight"
